[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dredge"
version = "0.1.0"
description = "Queue-and-archive download orchestrator for yt-dlp, gallery-dl and file hosts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dredge contributors" }]
dependencies = [
  "pyperclip>=1.9",
  "prompt-toolkit>=3.0",
  "rich>=13.7",
  "cryptography>=43",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dredge = "dredge.cli:main"
dredge-watch = "dredge.watch:main"
dredge-report = "dredge.report:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
