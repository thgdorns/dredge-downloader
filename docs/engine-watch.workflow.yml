# Weekly audit of the workarounds against the current engines.
#
# Copy this file to .github/workflows/engine-watch.yml once the login has the
# `workflow` scope (gh auth refresh -h github.com -s workflow). It is kept in
# docs/ because a push containing .github/workflows/ is rejected otherwise.
name: engine-watch

on:
  schedule:
    - cron: "17 6 * * 1"      # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the package and the current engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install --upgrade yt-dlp gallery-dl
      - name: Audit
        run: |
          set +e
          python -m dredge.watch > report.md
          echo "code=$?" >> "$GITHUB_ENV"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Open or update the tracking issue
        if: env.code != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="engine-watch: a workaround may be ready to retire"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "$title in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file report.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file report.md
          fi
